<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Inventory List</h2>
        </div>
        <button class="btn btn-outline-primary">New product</button>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Product Code</th>
                            <th>Product Name</th>
                            <th>Minimum Stock</th>
                            <th>Current Stock</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                       <!-- Loop through the inventory items and display them in the table -->
                       @for (item of inventory(); track $index) {
                            <tr>
                                <td>{{item.productCode}}</td>
                                <td>{{item.productName}}</td>
                                <td>{{item.minStock}}</td>
                                <td>{{item.currentStock}}</td>
                                <td> 
                                    <span class="badge" [class] = "{
                                        'text-bg-success': item.status === 'With Stock',
                                        'text-bg-warning': item.status === 'Low Stock',
                                        'text-bg-danger': item.status === 'Out of Stock'
                                    }">
                                        {{item.status}}
                                    </span>
                                </td>
                            </tr>
                        }@empty {
                            <!-- If no items are found show a message -->
                            <tr>
                                <td colspan="5" class="text-center">No inventory items found.</td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4">
        <ngb-pagination 
            [collectionSize]="totalRecords()"
            [page]="currentPage()"
            [pageSize]="pageSize()"
            (pageChange)="currentPage.set($event)">
        </ngb-pagination>
    </div>
</div>
